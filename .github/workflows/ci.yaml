name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dart:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Check pub score
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 0 .

  android:
    name: Build example (Android, builtInKotlin=${{ matrix.built-in-kotlin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This package applies no Kotlin plugin of its own, so it has to build
        # both ways. `false` is what `flutter create` writes today, and leaves
        # Flutter to apply KGP on the package's behalf. `true` is where Flutter
        # is heading, and leaves AGP 9 to compile Kotlin itself.
        built-in-kotlin: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate example platform folders
        working-directory: example
        run: flutter create --platforms=android .

      - name: Set android.builtInKotlin=${{ matrix.built-in-kotlin }}
        working-directory: example/android
        run: |
          sed -i '/^android\.builtInKotlin=/d' gradle.properties
          echo 'android.builtInKotlin=${{ matrix.built-in-kotlin }}' >> gradle.properties
          cat gradle.properties

      - name: Build
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: Build example (iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate example platform folders
        working-directory: example
        run: flutter create --platforms=ios .

      # Builds against Swift Package Manager, which is the default from
      # Flutter 3.44 on. A CocoaPods regression would show up as a resolution
      # failure here rather than in someone's app.
      - name: Build
        working-directory: example
        run: flutter build ios --debug --no-codesign
