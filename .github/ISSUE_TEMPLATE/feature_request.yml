name: Feature request
description: Suggest a new capability or API for carrier_info_plus
title: "feat: <short description>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the user-facing problem first, then the proposed API.

        Note that fields removed in 1.0.0 (`simSerialNo`, `phoneNumber`, `cellId`,
        `lac`, iOS `subscriberIdentifiers`) are not coming back — see the README
        for why each no longer returns data on a current OS.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and why does it matter? Avoid jumping to solutions here.
      placeholder: I can't tell which SIM is the default for data, only which ones exist.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the API surface. Dart code blocks are great.
      render: dart
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Which platforms can answer this?
      multiple: true
      options:
        - Android
        - iOS
    validations:
      required: true

  - type: textarea
    id: platform-api
    attributes:
      label: Underlying platform API
      description: |
        Which OS API returns this? Link the Android `TelephonyManager` /
        `SubscriptionManager` method or the iOS framework symbol, and note any
        permission it needs. Requests that need a new runtime permission are a
        harder sell — say so up front.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds exist today? Why aren't they enough?

  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This change would break existing users' code
        - label: I'd be willing to send a PR for this

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links to similar APIs in other packages, etc.
