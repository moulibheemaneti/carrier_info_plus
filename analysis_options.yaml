include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A package's public surface is its contract, so an undocumented member is
    # a bug report waiting to happen. Fail the build, not the review.
    public_member_api_docs: error

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
