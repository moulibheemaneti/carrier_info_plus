plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

group = "com.moulibheemaneti.carrier_info_plus"
version = "1.0"

android {
    // Declared here rather than in AndroidManifest.xml, which is what AGP 8+
    // requires and what keeps this building under AGP 9.
    namespace = "com.moulibheemaneti.carrier_info_plus"
    compileSdk = 36

    defaultConfig {
        minSdk = 24
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}
