plugins {
    id "com.android.library"
}

group = "com.moulibheemaneti.carrier_info_plus"
version = "1.0"

android {
    // Declared here rather than in AndroidManifest.xml, which is what AGP 8+
    // requires and what keeps this building under AGP 9.
    namespace = "com.moulibheemaneti.carrier_info_plus"
    compileSdk = 36

    defaultConfig {
        minSdk = 24
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// The Kotlin Gradle plugin is deliberately not applied. AGP 9 compiles Kotlin
// itself, and on AGP 8 — or AGP 9 with android.builtInKotlin=false — Flutter
// applies KGP to this project on our behalf. A package that applies KGP itself
// makes every app depending on it print a build warning today, and will stop
// those apps building once Flutter drops KGP support entirely.
//
// src/main/kotlin needs no sourceSets entry: it is a default Kotlin source
// directory for AGP either way.
//
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
